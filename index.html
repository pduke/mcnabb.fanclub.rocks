<!doctype html>
<html lang="en">
<head>
<title>The McNabb Family Archive</title><meta name="description" content="McNabb family biographies, interactive family tree, and historic research collected by Walter Craig Davidson."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--ink:#f1e8d5;--nav:#142635;--gold:#d7b778}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 4%,#435363,#152736 76%);color:var(--ink);font:16px/1.5 Georgia,serif}
nav{position:sticky;top:0;z-index:30;background:rgba(14,27,39,.97);border-bottom:1px solid #b2965c;box-shadow:0 6px 20px #050d16a8}
nav .inner{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;padding:8px 12px}
nav a{color:inherit;font:600 13px/1.2 system-ui,sans-serif;letter-spacing:.03em;text-decoration:none;padding:10px 13px;border-radius:4px;white-space:nowrap}
nav a:hover,nav a:focus-visible{background:#324b5a;color:#fff;outline:1px solid #a68e58}
.cover-wrap{width:min(95vw,690px);margin:24px auto 34px;position:relative;box-shadow:0 22px 65px #02080caa}
.cover{width:100%;display:block;height:auto}
.hotspot{position:absolute;display:block;border:2px solid transparent;border-radius:5px;transform:rotate(var(--rotate,0deg));transition:box-shadow .2s,border-color .2s,background .2s;cursor:pointer;outline-offset:3px}
@media(hover:hover){.hotspot:hover{border-color:#f8d88d;box-shadow:0 0 0 4px #f8d88d33,0 4px 22px #090d0bbb;background:#fcdf8820}}
.hotspot:focus-visible{border-color:#f8d88d;outline:2px solid #f8d88d;background:#fcdf8820}
.hotspot::after{content:attr(data-name) "\a" attr(data-dates);white-space:pre;text-align:center;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) rotate(calc(-1 * var(--rotate,0deg)));background:#15232af5;color:#fff6d9;padding:8px 12px;border:1px solid #d5bb88;border-radius:5px;font:600 clamp(10px,1.65vw,13px)/1.4 system-ui,sans-serif;white-space:pre;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px #070d14aa}
@media(hover:hover){.hotspot:hover::after{opacity:1}}
.hotspot:focus-visible::after{opacity:1}
.h-james{left:30.6%;top:32.8%;width:36.8%;height:20%;--rotate:-6deg}
.h-gilbert{left:10.6%;top:47.5%;width:24.4%;height:22.3%;--rotate:-11deg}
.h-scott{left:67.6%;top:41.7%;width:24.3%;height:17.1%;--rotate:12deg}
.h-ruth{left:37.6%;top:51.6%;width:24.6%;height:19.7%;--rotate:-9deg}
.h-nan{left:37.3%;top:70.5%;width:24.7%;height:19.2%;--rotate:-5deg}
.h-neil{left:62.7%;top:57.8%;width:25.0%;height:22.7%;--rotate:9deg}
@media(max-width:500px){nav a{font-size:12px;padding:9px 7px}.cover-wrap{margin:16px auto 24px}.hotspot::after{white-space:pre-wrap;text-align:center;min-width:125px;font-size:10px}}
</style><link rel="stylesheet" href="site-nav.css"></head>
<body>
<div id="site-nav"></div>
<main><div class="cover-wrap">
<img class="cover" src="assets/archive-cover.png" alt="The McNabb Family Archive cover, with six linked historical family portraits" width="1055" height="1491">

<a class="hotspot h-scott" href="mchtml/Walter%20Scott%20McNabb.html" data-name="Walter Scott McNabb" data-dates="1874–1936" aria-label="Read Walter Scott McNabb biography, 1874–1936"></a>
<a class="hotspot h-ruth" href="mchtml/Ruth%20Pauline%20Prutsman.html" data-name="Ruth Pauline Prutsman" data-dates="1906–1997" aria-label="Read Ruth Pauline Prutsman biography, 1906–1997"></a>
<a class="hotspot h-nan" href="mchtml/Beverly%20Nan%20McNabb.html" data-name="Beverly Nan McNabb" data-dates="1932–2025" aria-label="Read Beverly Nan McNabb biography, 1932–2025"></a>
<a class="hotspot h-neil" href="mchtml/Warren%20Neil%20McNabb.html" data-name="Warren Neil McNabb" data-dates="1934–2025" aria-label="Read Warren Neil McNabb biography, 1934–2025"></a>
</div></main>
<script src="site-nav.js"></script></body></html>
